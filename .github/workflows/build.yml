name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Bluey-Windows
          path: |
            windows/dist/*.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Bluey-Android
          path: android/app/build/outputs/apk/debug/*.apk

  apple:
    name: Mac and iPhone apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --scratch-path /tmp/bluey-swift
      - run: swift build --scratch-path /tmp/bluey-swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project GooglyEyes.xcodeproj -scheme GooglyEyes -configuration Debug
          -destination 'generic/platform=iOS' -derivedDataPath /tmp/BlueyDerivedData
          CODE_SIGNING_ALLOWED=NO build
