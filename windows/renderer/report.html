<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Research</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans.ttf"); }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Regular.ttf"); }
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf"); font-weight: 300 700; }
  :root { --berry: #6C86F5; --ink: #17151F; --soft: #5D5873; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .card { position: absolute; inset: 4px; box-sizing: border-box; padding: 18px; border-radius: 22px; border: 2.5px solid var(--berry);
    background: linear-gradient(#fff, #EEF0FF); color: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { font: 600 19px/1.25 Fredoka, "Segoe UI", sans-serif; margin: 0; flex: 1; }
  button { border: 0; background: #E7E9FB; color: var(--ink); width: 26px; height: 26px; border-radius: 13px; font-size: 16px; cursor: pointer; }
  .preview { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more, .label { font: 11px "IBM Plex Mono", monospace; color: var(--berry); letter-spacing: .5px; }
  .label { color: var(--soft); margin-top: 4px; }
  .body { overflow-y: auto; cursor: auto; padding-right: 6px; }
  .body p { font-size: 15px; margin: 0 0 12px; }
  .body a { display: block; font-size: 13px; color: var(--berry); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0; }
  .loading { color: var(--soft); font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ccd; border-top-color: var(--berry); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="report.js"></script>
</body>
</html>
