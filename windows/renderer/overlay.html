<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bluey cursor</title>
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf"); font-weight: 300 700; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #countdown { position: absolute; text-align: right; color: #fff; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; }
  #countdown .time { font-size: 76px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  #countdown .mode { font-size: 12px; font-weight: 600; letter-spacing: 1px; height: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="countdown"><div class="mode"></div><div class="time"></div></div>
<script src="overlay.js"></script>
</body>
</html>
